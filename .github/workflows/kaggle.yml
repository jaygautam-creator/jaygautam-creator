name: Refresh Kaggle ranks

on:
  schedule:
    - cron: "40 3 * * *" # daily, ~09:10 IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet "kaggle>=2.2"
      - run: python scripts/update_kaggle.py
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      - name: Commit if changed
        run: |
          if git diff --quiet -- README.md; then echo "unchanged"; exit 0; fi
          git config user.name "kaggle-rank-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -am "chore: refresh Kaggle ranks"
          git push
